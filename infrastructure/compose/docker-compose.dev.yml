version: '3.8'

networks:
  kdi-network:
    name: kdi-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  kdi_postgres_dev:
    name: kdi_postgres_dev
  kdi_redis_dev:
    name: kdi_redis_dev
  kdi_neo4j_data_dev:
    name: kdi_neo4j_data_dev
  kdi_neo4j_logs_dev:
    name: kdi_neo4j_logs_dev

services:
  # ==========================================
  # 1. PostgreSQL 16 - Development Database
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: kdi_postgres_dev
    restart: unless-stopped
    networks:
      kdi-network:
        ipv4_address: 172.28.0.2
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kdi_ai_office_dev}
      POSTGRES_USER: ${POSTGRES_USER:-kdi_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kdi_dev_password_only}
    ports:
      # Bound strictly to loopback interface 127.0.0.1 (Never 0.0.0.0)
      - "127.0.0.1:5432:5432"
    volumes:
      - kdi_postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kdi_admin} -d ${POSTGRES_DB:-kdi_ai_office_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. Redis 7 - Development Cache & Queues
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: kdi_redis_dev
    restart: unless-stopped
    networks:
      kdi-network:
        ipv4_address: 172.28.0.3
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD:-kdi_redis_dev_secret} 
      --maxmemory 512mb 
      --maxmemory-policy noeviction
    ports:
      # Bound strictly to loopback interface 127.0.0.1
      - "127.0.0.1:6379:6379"
    volumes:
      - kdi_redis_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-kdi_redis_dev_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 3. Neo4j 5 - Development Graph Memory
  # ==========================================
  neo4j:
    image: neo4j:5.20-community
    container_name: kdi_neo4j_dev
    restart: unless-stopped
    networks:
      kdi-network:
        ipv4_address: 172.28.0.4
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-kdi_neo4j_dev_password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1g
      NEO4J_dbms_memory_pagecache_size: 512m
    ports:
      # Bound strictly to loopback interface 127.0.0.1
      - "127.0.0.1:7474:7474" # Web Browser / HTTP
      - "127.0.0.1:7687:7687" # Bolt Protocol
    volumes:
      - kdi_neo4j_data_dev:/data
      - kdi_neo4j_logs_dev:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
