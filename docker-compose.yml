# ==========================================================
# docker-compose.yml
# KDI AI OFFICE — DOCKERIZED CONTROL PLANE DEPLOYMENT
# (Pure Control Plane in Docker, Native Windows for Antigravity Execution)
# ==========================================================

version: '3.8'

networks:
  kdi-control-plane-network:
    name: kdi-control-plane-network
    driver: bridge

volumes:
  kdi_postgres_data:
    name: kdi_postgres_data
  kdi_redis_data:
    name: kdi_redis_data
  kdi_neo4j_data:
    name: kdi_neo4j_data

services:
  # ==========================================
  # 1. PostgreSQL 16 - Control Plane State & Tasks
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: kdi_postgres_control_plane
    restart: unless-stopped
    networks:
      - kdi-control-plane-network
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kdi_ai_office}
      POSTGRES_USER: ${POSTGRES_USER:-kdi_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kdi_secure_password_2026}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kdi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kdi_admin} -d ${POSTGRES_DB:-kdi_ai_office}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. Redis 7 - Queues, Events & Locks
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: kdi_redis_control_plane
    restart: unless-stopped
    networks:
      - kdi-control-plane-network
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD:-kdi_redis_secret_2026} 
      --maxmemory 512mb 
      --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - kdi_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-kdi_redis_secret_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 3. Neo4j 5 - Knowledge Graph & Memory
  # ==========================================
  neo4j:
    image: neo4j:5.20-community
    container_name: kdi_neo4j_control_plane
    restart: unless-stopped
    networks:
      - kdi-control-plane-network
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-kdi_neo4j_secret_2026}
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1g
      NEO4J_dbms_memory_pagecache_size: 512m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - kdi_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ==========================================
  # 4. KDI Control Plane API & Orchestrator
  # Server-side Brain, Telegram, Queue, Approvals
  # ==========================================
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: kdi_control_plane_api
    restart: unless-stopped
    networks:
      - kdi-control-plane-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:-kdi_jwt_secret_pilot_2026}
      POSTGRES_URL: postgresql://${POSTGRES_USER:-kdi_admin}:${POSTGRES_PASSWORD:-kdi_secure_password_2026}@postgres:5432/${POSTGRES_DB:-kdi_ai_office}
      REDIS_URL: redis://:${REDIS_PASSWORD:-kdi_redis_secret_2026}@redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-kdi_neo4j_secret_2026}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_OWNER_ID: ${TELEGRAM_OWNER_ID:-123456789}
      KDI_WINDOWS_HOST_AUTH_TOKEN: ${KDI_WINDOWS_HOST_AUTH_TOKEN:-kdi_exec_token_default_secret}
      KDI_WINDOWS_HOST_ENDPOINT: http://host.docker.internal:3001
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/engineering/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 5. KDI Living Office Web Dashboard
  # ==========================================
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: kdi_control_plane_web
    restart: unless-stopped
    networks:
      - kdi-control-plane-network
    depends_on:
      - api
    ports:
      - "127.0.0.1:5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
